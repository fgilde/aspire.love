# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: aspire.love
description: "The aspire.love Studio on Windows, the cross-platform CLI everywhere else. This repository generates an Aspire AppHost into a Lovable project; it is not an AppHost itself, so there is no dashboard to open."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore

tasks:
  - name: studio
    run:
      windows: dotnet run --project src/AspireLove.Wpf
      linux: dotnet run --project src/AspireLove.Cli -- --help
      macos: dotnet run --project src/AspireLove.Cli -- --help
    readyWhen: {window: true}
